services:
  settlr:
    image: chavda2772/settlr:latest
    container_name: settlr
    environment:
      # Application
      NEXT_PUBLIC_APP_NAME: "Settlr"
      NEXT_PUBLIC_APP_DESCRIPTION: "Settlr for managing personal finance"
      ADVANCE_PASS_CHECK: "true"

      # Better Auth (C-5: Require unique random secret)
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET environment variable is required}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-}"

      # DATABASE
      DATABASE_URL: "postgresql://next_user:next_pass@postgres_db:5432/next_template?schema=public"

    ports:
      - "3000:3000"
    volumes:
      # M-7: Persistent uploads volume to prevent file deletion upon container recreation
      - uploads_data:/app/uploads
    networks:
      - prisma-network
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # C-5: Prisma Studio bound strictly to localhost 127.0.0.1 to prevent unauthenticated internet exposure
  prisma-studio:
    image: chavda2772/prisma-studio:latest
    container_name: property_prisma_studio
    restart: always
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      DATABASE_URL: "postgresql://next_user:next_pass@postgres_db:5432/next_template?schema=public"
      STUDIO_PORT: 5555
      STUDIO_HOST: "127.0.0.1"
      STUDIO_BROWSER: "none"
      AUTO_INTROSPECT: ${AUTO_INTROSPECT:-true}
    networks:
      - prisma-network
    depends_on:
      settlr:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
